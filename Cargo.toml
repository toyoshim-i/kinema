[workspace]
members = [
    "crates/kinema-syntax",
    "crates/kinema-fmt",
    "crates/kinema-elab",
    "crates/kinema-lint",
    "crates/kinema-kicad",
    "crates/kinema-equiv",
    "crates/kinema-cli",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["toyoshim", "kinema contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
kinema-syntax = { path = "crates/kinema-syntax" }
kinema-fmt = { path = "crates/kinema-fmt" }
kinema-elab = { path = "crates/kinema-elab" }
kinema-lint = { path = "crates/kinema-lint" }
kinema-kicad = { path = "crates/kinema-kicad" }
kinema-equiv = { path = "crates/kinema-equiv" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.10", features = ["v5"] }
clap = { version = "4.5", features = ["derive"] }
proptest = "1.5"
thiserror = "1.0"
