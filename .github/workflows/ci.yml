name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run workspace tests
        run: cargo test --workspace --verbose
